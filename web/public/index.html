<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShreyaLang Compiler</title>
  <meta name="description" content="An interactive view of every phase of the ShreyaLang compiler: tokens, AST, symbols, TAC, optimization and execution.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="favicon.svg" alt="" width="34" height="34">
      <div>
        <h1>ShreyaLang Compiler</h1>
        <p>Learn the language and watch the real compiler work through every phase</p>
      </div>
    </div>
    <nav class="modes" aria-label="Sections">
      <a href="#tab=overview" data-mode="explorer">Compiler</a>
      <a href="#learn" data-mode="learn">Learn</a>
    </nav>
    <div class="topbar-actions">
      <span id="server-status" class="pill">connecting…</span>
      <button id="theme-toggle" class="icon-btn" type="button" title="Switch light / dark theme" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8A9 9 0 0 0 12 3z"/></svg>
      </button>
    </div>
  </header>

  <main class="layout" id="explorer-view">
    <section class="left">
      <div class="card editor-card">
        <div class="toolbar">
          <label class="visually-hidden" for="examples">Example programs</label>
          <select id="examples" title="Load an example program"></select>
          <span class="spacer"></span>
          <label class="switch" title="Recompile and run automatically while you type">
            <input type="checkbox" id="auto-run" checked>
            <span class="track"><span class="thumb"></span></span>
            <span>Auto-run</span>
          </label>
          <button id="run" class="primary" type="button" title="Compile and run (Ctrl+Enter)">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l13-7.5z"/></svg>
            Run <kbd>Ctrl ↵</kbd>
          </button>
        </div>

        <div class="editor" id="editor">
          <div class="gutter" id="gutter" aria-hidden="true"></div>
          <div class="code">
            <div class="highlight" id="highlight" aria-hidden="true"></div>
            <textarea id="source" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" aria-label="ShreyaLang source code"></textarea>
          </div>
        </div>

        <div class="options">
          <span class="opt-title">Optimizer passes</span>
          <label class="chk" title="Constant folding (--no-fold to disable)"><input type="checkbox" id="opt-fold" checked> Folding</label>
          <label class="chk" title="Constant propagation (--no-prop to disable)"><input type="checkbox" id="opt-prop" checked> Propagation</label>
          <label class="chk" title="Dead-code elimination (--no-dce to disable)"><input type="checkbox" id="opt-dce" checked> Dead code</label>
          <span class="spacer"></span>
          <label class="steps" title="VM instruction limit (--max-steps)">Max steps
            <input type="number" id="max-steps" value="1000000" min="1" max="10000000" step="1">
          </label>
        </div>
        <div class="statusbar" id="statusbar"></div>
      </div>

      <div class="card console-card">
        <div class="card-head">
          <h2>Program output</h2>
          <span id="console-meta" class="muted small"></span>
        </div>
        <pre id="console" class="console"></pre>
      </div>
    </section>

    <section class="right">
      <nav class="pipeline" id="pipeline" aria-label="Compiler phases"></nav>
      <div class="card tabs-card">
        <div class="tabs" id="tabs" role="tablist"></div>
        <div class="tab-body" id="tab-body" role="tabpanel"></div>
      </div>
    </section>
  </main>

  <main class="learn" id="learn-view" hidden></main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
